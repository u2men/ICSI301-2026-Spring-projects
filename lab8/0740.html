    <style>
        article {
            border: 1px solid black;
            padding: 10px;
            width: 300px;
        }
    input[type="checkbox"], input[type="radio"] {
        display: none;
    }
    .like {
        font-size: 2em;
        cursor: pointer;
        filter:grayscale(100%);

        &:has(input:checked) {
            filter:grayscale(0%);
        }
    }
    section{border:1px solid gray; padding:10px; width:300px;}
    label {
        display: inline-block;
        padding: 5px 10px;
        background-color: lightgray;
        cursor: pointer;
    }
    section:not(:has(input:checked)) {
        display: none;
    }

    </style>
</head>
