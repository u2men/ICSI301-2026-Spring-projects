<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --color-main-h: 90;
            --color-main-s: 40%;

            --color-white-0: hsl(0, 0%, 100%);
            --color-white-1: hsl(0, 0%, 95%);
            --color-white-2: hsl(0, 0%, 90%);
            --color-white-3: hsl(0, 0%, 85%);
            --color-white-4: hsl(0, 0%, 80%);
            --color-white-5: hsl(0, 0%, 75%);
            --color-white-6: hsl(0, 0%, 70%);
            --color-white-7: hsl(0, 0%, 65%);
            --color-white-8: hsl(0, 0%, 60%);
            --color-white-9: hsl(0, 0%, 55%);

            --color-black-0: hsl(0, 0%, 0%);
            --color-black-1: hsl(0, 0%, 5%);
            --color-black-2: hsl(0, 0%, 10%);
            --color-black-3: hsl(0, 0%, 15%);
            --color-black-4: hsl(0, 0%, 20%);
            --color-black-5: hsl(0, 0%, 25%);
            --color-black-6: hsl(0, 0%, 30%);
            --color-black-7: hsl(0, 0%, 35%);
            --color-black-8: hsl(0, 0%, 40%);
            --color-black-9: hsl(0, 0%, 45%);


            --color-main: hsl(var(--color-main-h), var(--color-main-s), 60%);
            --color-main-dark: hsl(var(--color-main-h), var(--color-main-s), 20%);
            --color-main-light: hsl(var(--color-main-h), var(--color-main-s), 80%);
            --color-main-lighter: hsl(var(--color-main-h), var(--color-main-s), 95%);


            --color-bg: var(--color-main-dark);
            --color-border: var(--color-black-2);

            --size-0: 0.5dvh;
            --size-1: 0.7dvh;
            --size-2: 1dvh;
            --size-3: 1.5dvh;
            --size-4: 1.8dvh;
            --size-5: 2dvh;

            --size-9: 5dvh;

            --size-padding: var(--size-2);
            --size-padding-thin: var(--size-1);
            --size-padding-thick: var(--size-3);

            --size-margin: var(--size-3);

            --font-family-main: 'Segoe UI';
            --font-size: 12px;
            --shadow-box: -6px -6px 8px hsl(189, 100%, 57%);
            --text-heading-font: 400 var(--font-size) var(--font-family-main);
        }

        body {
            color: #eee;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        #case {
            aspect-ratio: 1 / 2;
            height: 100dvh;
            margin: 20px auto;
            padding: var(--size-5) var(--size-3);
            border: 4px solid var(--color-border);
            border-radius: 36px;
            outline: 2px solid var(--color-white-4);
            background-color: var(--color-bg);
            box-shadow: var(--shadow-box);

            display: grid;
            grid-template-areas:
                "h h"
                "c c"
                "cl cr"
                "d d"
                "m m";
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 60px 50px auto auto auto;
            gap: 4px;
        }

        h1 {
            font-size: 12px;
            font-weight: 100;
        }

        h2 {
            font-size: var(--size-9);
            font-weight: 100;
        }

        h1,
        h2 {
            letter-spacing: 1px;
        }

        ul {
            list-style: none;
            width: 200px;
            height: var(--size-9);
            padding: 0;
            display: flex;
            gap: 4px;
            overflow-x: scroll;
            overflow-y: hidden;
            scrollbar-width: none;
        }


        .category {
            margin: 0;
            padding: 4px 8px;
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 10px;
            color: #ddd;
            text-decoration: none;
            background-color: #444;
            transition:all 0.3s ease-in;

            &.selected {
                border-color: #fff;
                border: 1px solid #ccc;
                background-color: transparent;

            }

            &:hover {
                border-color: #fff;
                background-color: #444;
                box-shadow: var(--shadow-box);
                transform:translateX(-1px) translateY(-1px);

            }
        }



        .badge {
            padding: 2px;
            border-radius: 8px;
            position: absolute;
            top: -4px;
            left: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            font-size: 7px;
            color: #222;
            background-color: #e9e9e9;
        }

        .cats {grid-area:c;}
        header{grid-area:h;}
        .menubtns{grid-area:m;}
        .card {
            flex: 1;
            padding: 0 4px;
            width: 200px;
            height: 20dvh;
            border: 1px solid transparent;
            border-radius: 16px;
            background-color: #666;


            &.right {
                grid-area: cr;
                right: 0px;
                background: linear-gradient(235deg, #bdd6a8, #5b6a50);

                h3 {
                    font-size: var(--size-4);
                }

                p {
                    font-size: var(--size-5);
                }
            }

            h3 {
                font-weight: 100;
            }

            &.left {
                grid-area: cl;
                h3 {
                    display: inline-block;
                    width: 50px;
                    font-size: 12px;
                }
            }


            button {
                width: 100%;
                margin-top: 4px;
                padding: 4px 0;
                border: 1px solid transparent;
                border-radius: 12px;
                background-color: #777;
                color: #eee;
                font-size: 10px;
            }
        }

        svg {
            display: inline-block;
            fill: #e1ffc9;
        }

        nav {
            background-color: #555;
            border-radius: 24px;
            width: 100%;
            height: 40px;
            text-align: center;

            svg {
                margin: 0 20px;
                padding: 8px 0;
            }


        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: var(--color-black-4);
            }
        }

        @media (min-width: 500px) {
            #case {
                grid-template: 
                "h m m" 60px
                "c cl cr" auto / 2fr 1fr 1fr;
            }
        }
    </style>
</head>

<body>
